<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Bill Generator</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    
    <!-- LOOPHOLE FIX 1: Material Symbols Rounded for Premium Native Feel -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

    <!-- LOOPHOLE FIX 2: Multi-color Professional Banner (Appears on all screens) -->
    <div class="premium-banner"></div>

    <!-- 1. SPLASH SCREEN -->
    <div id="splash-screen" class="screen active">
        <div class="neumorphic-circle">
            <h1 class="logo-text">BG</h1>
        </div>
        <p class="loading-text">Loading Workspace...</p>
    </div>

    <!-- 2. LOGIN SCREEN (Remains Same, just ensuring structure) -->
    <div id="login-screen" class="screen hidden">
        <div class="login-card neumorphic-card">
            <span class="material-symbols-rounded premium-icon" style="font-size: 48px;">lock</span>
            <h2>Secure Login</h2>
            <form id="login-form">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Username" required class="neumorphic-input">
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required class="neumorphic-input">
                </div>
                <p id="auth-error" class="error-msg hidden"></p>
                <button type="submit" class="neumorphic-btn" id="login-btn">Authenticate</button>
            </form>
        </div>
    </div>

    <!-- 3. MAIN DASHBOARD (Updated with Material Icons) -->
    <div id="main-app" class="screen hidden">
        <nav class="neumorphic-nav">
            <h2>BillGen Pro</h2>
            <button id="logout-btn" class="neumorphic-btn-small">Logout</button>
        </nav>
        <div class="dashboard-content">
            <div class="dashboard-grid">
                <div class="grid-card neumorphic-card" id="btn-open-new-bill">
                    <span class="material-symbols-rounded grid-icon">post_add</span>
                    <h3>Create Bill</h3>
                </div>
                <div class="grid-card neumorphic-card" id="btn-open-prev-bills">
                    <span class="material-symbols-rounded grid-icon">folder_open</span>
                    <h3>History</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. NEW BILL SCREEN (Updated Icons) -->
    <div id="new-bill-screen" class="screen hidden native-layout">
        <div class="fixed-title-bar">
            <button class="neumorphic-btn-icon back-btn" data-target="main-app"><span class="material-symbols-rounded">arrow_back</span></button>
            <h2>New Invoice</h2>
            <button class="neumorphic-btn-icon" id="btn-add-row"><span class="material-symbols-rounded">add</span></button>
        </div>
        
        <div class="scrollable-body">
            <div class="form-container" id="bill-items-container">
                <div class="bill-row neumorphic-inset">
                    <input type="text" class="item-desc" placeholder="Designation (e.g. Developer)" required>
                    <div class="row-math">
                        <input type="number" class="item-pree" placeholder="Pree Days" step="0.01" required>
                        <input type="number" class="item-per" placeholder="Per Day ₹" step="0.01" required>
                    </div>
                </div>
            </div>
            
            <div class="action-footer">
                <button id="btn-generate-pdf" class="neumorphic-btn accent-btn">Generate & Save PDF</button>
            </div>
        </div>
    </div>

    <!-- 5. PREVIOUS BILLS SCREEN -->
    <div id="prev-bills-screen" class="screen hidden native-layout">
        <div class="fixed-title-bar">
            <button class="neumorphic-btn-icon back-btn" data-target="main-app"><span class="material-symbols-rounded">arrow_back</span></button>
            <h2>Previous Bills</h2>
            <div style="width:40px;"></div>
        </div>
        <div class="scrollable-body" id="prev-bills-container">
            <p style="text-align:center; margin-top:20px;">Fetching from Database...</p>
        </div>
    </div>

    <script>
        window.appModuleLoaded = false;
        setTimeout(() => {
            if (!window.appModuleLoaded) {
                const splashText = document.querySelector('.loading-text');
                if(splashText) {
                    splashText.innerText = "Fatal Error: Module Blocked! Check hosting.";
                    splashText.style.color = "var(--error-color)";
                }
            }
        }, 4000);
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
